<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPPON Graphic Store - Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Admin Panel</h1>
        <a href="/">Go to Store</a>
    </header>
    <main>
        <section id="product-form-section">
            <h2>Add/Edit Product</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description"></textarea>
                </div>
                <div class="form-group">
                    <label for="price">Price</label>
                    <input type="number" id="price" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="logos">Logos</option>
                        <option value="banners">Banners</option>
                        <option value="flyers">Flyers</option>
                        <option value="social-media">Social Media</option>
                        <option value="general">General</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="tags">Tags (comma-separated)</label>
                    <input type="text" id="tags">
                </div>
                <div class="form-group">
                    <label for="image">Image</label>
                    <input type="file" id="image" accept="image/*">
                    <img id="image-preview" src="" alt="Image Preview" style="display: none; max-width: 200px; margin-top: 10px;">
                </div>
                <button type="submit">Save Product</button>
                <button type="button" id="cancel-edit" style="display: none;">Cancel Edit</button>
            </form>
        </section>
        <section id="product-list-section">
            <h2>Product List</h2>
            <div id="product-list" class="grid-container"></div>
        </section>
    </main>
    <div id="notification" class="notification"></div>
    <script src="admin.js"></script>
</body>
</html>
